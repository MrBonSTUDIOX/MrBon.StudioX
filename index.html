<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MrBon StudioX</title>
<meta name="description" content="MrBon StudioX — home of Survive from MrBon. Download the game and join the community.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:#111;font-family:'Inter',sans-serif}

section{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;text-align:center;gap:32px}

/* 1. Hero */
.hero{position:relative;background:#fff}
.logo{width:160px;height:auto;display:block}
.typed{margin:0;font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(44px,10vw,112px);line-height:1.05;letter-spacing:2px;text-transform:uppercase;min-height:1.1em}
.typed .red{color:#e11d2e}
.caret{display:inline-block;width:.06em;height:.9em;margin-left:.06em;background:#111;vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{margin:0;font-size:18px;color:#555}
.scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:#777;font-size:14px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:6px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,6px)}}

/* 2. Game */
.game .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:48px}
.bear{height:min(46vh,420px);width:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 18px 18px rgba(0,0,0,.18))}
.game-info{display:flex;flex-direction:column;gap:20px;align-items:flex-start;text-align:left}
.eyebrow{font-size:14px;letter-spacing:3px;text-transform:uppercase;color:#555;font-weight:600}
.game h2{margin:0;font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(36px,6vw,64px);text-transform:uppercase;line-height:1}
.game p{margin:0;max-width:360px;font-size:18px;line-height:1.55;color:#555}

.btn{min-height:60px;padding:0 36px;display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:999px;font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;color:#fff;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-red{background:#e11d2e;box-shadow:0 10px 24px rgba(225,29,46,.35)}
.btn-red:hover{background:#c8101f;box-shadow:0 14px 28px rgba(225,29,46,.45)}
.btn-discord{background:#5865f2;box-shadow:0 10px 24px rgba(88,101,242,.35)}
.btn-discord:hover{background:#4752c4}
.btn-tiktok{background:#111;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.btn-tiktok:hover{background:#2a2a2a}

/* 3. Community */
.community h2{margin:0;font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(36px,6vw,64px);text-transform:uppercase}
.community p{margin:0;max-width:420px;font-size:18px;line-height:1.55;color:#555}
.buttons{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}

.credit{display:flex;align-items:center;justify-content:center;gap:22px;padding:40px 24px 48px;font-size:17px;color:#777;letter-spacing:1px}
.social{display:block;line-height:0;transition:transform .15s}
.social:hover{transform:scale(1.12)}
.social img{height:40px;width:auto;display:block}

/* appear on scroll */
.reveal{opacity:0;transform:translateY(28px);transition:opacity .8s ease,transform .8s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .reveal{opacity:1;transform:none;transition:none}
  .caret,.scroll{animation:none}
}
@media (max-width:640px){
  .game-info{align-items:center;text-align:center}
  .row{gap:28px}
}
</style>
</head>
<body>

<section class="hero" id="top">
  <img class="logo" src="studio.png" alt="MrBon StudioX logo">
  <h1 class="typed" aria-label="MrBon StudioX"><span id="typed"></span><span class="caret"></span></h1>
  <p class="sub">Indie game studio</p>
</section>

<section class="game" id="game">
  <div class="row reveal">
    <img class="bear" src="bear.png" alt="MrBon the bear">
    <div class="game-info">
      <div class="eyebrow">Our game</div>
      <h2>Survive from MrBon</h2>
      <p>A 2D survival horror game. Lock the door, hold on, and survive the bear.</p>
      <a class="btn btn-red dl" href="#">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
        Download
      </a>
    </div>
  </div>
</section>

<footer class="credit">
  <a class="social" href="https://discord.gg/MED4eb9MPr" target="_blank" rel="noopener" aria-label="Join our Discord server"><img src="discord.png" alt="Discord"></a>
  <a class="social" href="https://www.tiktok.com/@mrbon.official" target="_blank" rel="noopener" aria-label="Watch our TikTok profile"><img src="tiktok.png" alt="TikTok"></a>
  <span>asadullahexe</span>
</footer>

<script>
// PUT YOUR GAME DOWNLOAD LINK HERE
var DOWNLOAD_URL = "https://mrbonstudiox.github.io/Survive-from-MrBon/";
document.querySelectorAll(".dl").forEach(function(a){ a.href = DOWNLOAD_URL; });

// Typing animation
(function(){
  var el = document.getElementById("typed");
  var text = "MrBon StudioX";
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function render(n){
    var s = text.slice(0, n);
    el.textContent = s;
  }
  if (reduce){ render(text.length); return; }
  var i = 0;
  setTimeout(function tick(){
    i++; render(i);
    if (i < text.length) setTimeout(tick, 140);
  }, 600);
})();

// Reveal on scroll
(function(){
  var items = document.querySelectorAll(".reveal");
  if (!("IntersectionObserver" in window)){ items.forEach(function(e){ e.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.25 });
  items.forEach(function(e){ io.observe(e); });
})();
</script>
</body>
</html>
